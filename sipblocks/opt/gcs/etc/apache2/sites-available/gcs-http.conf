<VirtualHost _default_:80>

	RewriteEngine On

    RewriteCond %{REQUEST_METHOD} ^(TRACE|TRACK)
    RewriteRule .* - [F]

# redirect non-provisioning requests to SSL
     
    RewriteRule ^(.*) https://%{HTTP_HOST}$1 [R=301,L]

# Directories

 	DocumentRoot /opt/gcs/www/
    AddType application/x-httpd-php .php .php3

    Alias /gcs-common /opt/gcs/www/gcs-common
    Alias /provisioning /opt/gcs/provisioning/device.php
    Alias /public /opt/gcs/public

<Directory /opt/gcs/www>
    Options None
    Options +Indexes
    Options +Includes
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>

<Directory /opt/gcs/public>
   Require all granted
   Satisfy any
</Directory>

<Directory /opt/gcs/provisioning>
   Require all granted
   Satisfy any
</Directory>     
</VirtualHost>