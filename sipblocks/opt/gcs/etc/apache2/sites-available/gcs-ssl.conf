<IfModule mod_ssl.c>
<VirtualHost _default_:443>

SSLEngine on
    
#   limit uploads to 40 Meg                                                       

    LimitRequestBody 41943040

#   Override php.ini and allow <= 40 Meg

    php_value upload_max_filesize 40M
    php_value post_max_size 40M

    RewriteEngine on
 
    RewriteCond %{REQUEST_METHOD} ^(TRACE|TRACK)
    RewriteRule .* - [F]

    
    # Rewrites for the provisioning server

    RewriteRule /provisioning/(.*sip\.ld) https://%{HTTP_HOST}/public/polycom/$1
    RewriteRule /provisioning/bootrom\.ld https://%{HTTP_HOST}/public/polycom/bootrom.ld
    RewriteRule /provisioning/(42.*) https://%{HTTP_HOST}/public/$1
    RewriteRule /provisioning/(sifs.*) https://%{HTTP_HOST}/public/$1
    RewriteRule ^Config(.*)\.cfg provisioning?mac=$1 [L]
    RewriteRule /provisioning/(SoundPointIPLocalization.*) https://%{HTTP_HOST}/public/polycom/$1


	DocumentRoot /opt/gcs/www/
    AddType application/x-httpd-php .php .php3

    ScriptAlias /gcs/cgi-bin /opt/gcs/www/cgi-bin
    Alias /gcs-common /opt/gcs/www/gcs-common
    Alias /server-sounds /usr/share/asterisk/sounds
    Alias /server-moh /usr/share/asterisk
    Alias /server-vmail /var/spool/asterisk/voicemail
    Alias /provisioning /opt/gcs/provisioning/device.php
    Alias /public /opt/gcs/public
    Alias /php /opt/gcs/php
    Alias /prog /opt/gcs/php
    Alias /media /opt/gcs/media 
    AliasMatch ^/(snom.*) /opt/gcs/public/snom/$1     


<Directory /opt/gcs/php>

                Options None
                Options -Indexes
                Options +Includes
                AllowOverride None
		Require all granted
</Directory>

<Directory /opt/gcs/php>
    AddType application/x-httpd-php .php .php3 .phtml
    AddType application/x-httpd-php-source .phps
    php_admin_value open_basedir /opt/gcs/:/usr/share:/etc:/var/lock/subsys:/var/log:/tmp:/var/spool/asterisk
</Directory>

<Directory /opt/gcs/www>
    Options None
    Options +Indexes
    Options +Includes
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>

<Directory /opt/gcs/public>
   Require all granted
   Satisfy any
</Directory>

<Directory /opt/gcs/provisioning>
   Require all granted
   Satisfy any
</Directory>

<Directory /opt/gcs/media>
    Options Indexes MultiViews
    AllowOverride None
    Require all granted
</Directory>

<Directory /usr/share/asterisk/sounds>
    Options Indexes MultiViews
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/spool/asterisk/voicemail>
    Options Indexes MultiViews
    AllowOverride None
    Require all granted
</Directory>	

 <Location /console>
    ProxyPass  http://localhost:63005/
    Order      allow,deny
    Allow      from all
  </Location>
		
	ErrorLog ${APACHE_LOG_DIR}/error.log

	LogLevel warn

	CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined


</VirtualHost>
</IfModule>
