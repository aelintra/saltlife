[general]
format=wav
pbxskip=yes
serveremail=vm@gcs
fromstring=SARK PBX Voicemail
attach=yes
maxsecs=300
maxgreet=30
minsecs=2
maxsilence=6
operator=no
nextaftercmd=yes
externnotify=/opt/gcs/scripts/vmnotify.sh
